name: Sync approved mother baby logo

on:
  push:
    branches: [fix/use-approved-mother-baby-mark]

permissions:
  contents: write

jobs:
  sync-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/use-approved-mother-baby-mark
      - name: Copy approved maternal mark from app repository
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/mkraja826/Janani/main/assets/branding/janani-mark.png -o assets/pregalove-logo.png
          test -s assets/pregalove-logo.png
          file assets/pregalove-logo.png | grep -q 'PNG image data'
      - name: Commit synced logo if changed
        run: |
          if git diff --quiet -- assets/pregalove-logo.png; then
            echo 'Logo already matches approved maternal mark.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pregalove-logo.png
          git commit -m 'Use approved mother and baby logo'
          git push origin HEAD:fix/use-approved-mother-baby-mark
