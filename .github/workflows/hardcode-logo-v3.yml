name: Hardcode mother baby logo v3

on:
  push:
    branches: [fix/hardcode-mother-baby-logo-v3]

permissions:
  contents: write

jobs:
  update-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/hardcode-mother-baby-logo-v3

      - name: Hardcode maternal logo and favicon in every public page
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').glob('**/index.html'):
              text = path.read_text(encoding='utf-8')
              prefix = 'assets/' if path == Path('index.html') else '../assets/'
              img = f'<span class="brand-mark" aria-hidden="true"><img src="{prefix}pregalove-mother-baby-v3.png" alt="" width="44" height="44" decoding="async"></span>'
              text = text.replace('<span class="brand-mark" aria-hidden="true"></span>', img)
              text = text.replace(f'{prefix}site-mother-baby-v2.js', f'{prefix}site-v3.js')
              text = text.replace(f'{prefix}site.js', f'{prefix}site-v3.js')
              if 'rel="icon"' not in text:
                  marker = f'<link rel="stylesheet" href="{prefix}styles.css">'
                  if marker in text:
                      text = text.replace(marker, marker + f'\n  <link rel="icon" type="image/png" href="{prefix}pregalove-mother-baby-v3.png">', 1)
              path.write_text(text, encoding='utf-8')

          styles = Path('assets/styles.css')
          css = styles.read_text(encoding='utf-8')
          guard = '/* PregaLove hardcoded maternal logo v3 */'
          if guard not in css:
              css += '''\n\n/* PregaLove hardcoded maternal logo v3 */\n.brand-mark{background:transparent!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important}\n.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}\n'''
              styles.write_text(css, encoding='utf-8')
          PY

      - name: Verify no public page depends on JavaScript for logo rendering
        run: |
          set -euo pipefail
          test "$(grep -RIl 'pregalove-mother-baby-v3.png' --include='index.html' . | wc -l)" -ge 10
          ! grep -R 'site-mother-baby-v2.js' --include='index.html' .
          ! grep -R '<span class="brand-mark" aria-hidden="true"></span>' --include='index.html' .

      - name: Commit hardcoded logo references
        run: |
          if git diff --quiet; then
            echo 'Pages already use hardcoded maternal logo v3.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html */index.html assets/styles.css
          git commit -m 'Hardcode mother and baby logo in public HTML'
          git push origin HEAD:fix/hardcode-mother-baby-logo-v3
