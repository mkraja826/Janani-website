name: Cache bust maternal logo refs

on:
  push:
    branches: [fix/cache-bust-mother-baby-logo]

permissions:
  contents: write

jobs:
  update-refs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cache-bust-mother-baby-logo
      - name: Point all public pages to cache-busted site script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            sed -i 's#assets/site\.js#assets/site-mother-baby-v2.js#g' "$file"
          done < <(find . -name index.html -print0)
      - name: Commit page references if changed
        run: |
          if git diff --quiet; then
            echo 'All pages already use the cache-busted script.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '**/index.html' index.html
          git commit -m 'Cache bust mother and baby logo references'
          git push origin HEAD:fix/cache-bust-mother-baby-logo
